name: build-and-test

on:
  push:
  pull_request:
  schedule:
    - cron: "17 8 */3 * *"    # every 3 days at 8:17 UTC
  workflow_dispatch:

jobs:
  build-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-15-intel"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5

    - name: Set up miniconda
      uses: conda-incubator/setup-miniconda@v4
      with:
        architecture: "x86_64"
        channels: conda-forge,bioconda
        channel-priority: strict
        conda-remove-defaults: true
        auto-update-conda: true

    - name: Build conda package
      run: |
        conda install -n base conda-build -y
        conda build conda-recipe --output-folder build_artifacts

    - name: Create conda env
      run: conda create -n bit -y

    - name: Add local area as channel
      run: conda run -n bit conda config --add channels file://${PWD}/build_artifacts

    - name: Install package
      run: |
        conda run -n bit conda install bit rust maturin cxx-compiler -y
        # the editable install (which rebuilds the compiled part, hence rust and maturin) is so
        # test coverages make sense
        conda run -n bit pip install --no-build-isolation -e .

    - name: Print installed bit version
      run: conda run -n bit bit -v

    - name: Print conda info
      run: |
        conda run -n bit conda list --explicit

    - name: Run pytest
      run: conda run -n bit pytest
