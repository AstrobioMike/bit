[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "bit"
version = "2.12.0"
description = "A set of bioinformatics programs and workflows"
readme = "README.md"
license = { text = "GPLv3" }
authors = [{ name = "Mike Lee", email = "Michael.Lee0517@gmail.com" }]
urls = { Repository = "https://github.com/AstrobioMike/bit" }
# dependencies handled by conda installation

# the compiled part (rust/) is built as bit._native alongside the Python package, and
# everything in bit/ (tests/data, smk/, etc.) is included with it
[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "bit._native"
python-packages = ["bit"]
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**"]

[project.scripts]
bit = "bit.cli.bit:main"

[tool.pytest.ini_options]
testpaths = ["bit/tests"]
addopts = [
    "--cov",
    "--cov-context=test",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-config=.coveragerc",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing"]
source = [
    "bit.modules",
    "bit.cli.gen_metagenome"
]
omit = [
    "*/__init__.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]
